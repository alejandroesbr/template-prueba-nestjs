services:
  # ============================================================================
  # NestJS Application Service
  # Run standalone:       docker compose up -d --build
  # Run with PostgreSQL:  docker compose --profile postgres up -d --build
  # Run with MySQL:       docker compose --profile mysql up -d --build
  # Run with MongoDB:     docker compose --profile mongo up -d --build
  # Run with Redis:       docker compose --profile redis up -d --build
  # ============================================================================
  app:
    build:
      context: .
      target: development
    container_name: nestjs_app
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    networks:
      - app_network

  # ============================================================================
  # PostgreSQL Database (Activate with: --profile postgres)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: nestjs_postgres
    profiles: ["postgres", "full"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-app_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  # ============================================================================
  # MySQL Database (Activate with: --profile mysql)
  # ============================================================================
  mysql:
    image: mysql:8.0
    container_name: nestjs_mysql
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-app_db}
      MYSQL_USER: ${DB_USERNAME:-mysql_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mysql_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

  # ============================================================================
  # MongoDB Database (Activate with: --profile mongo)
  # ============================================================================
  mongo:
    image: mongo:7
    container_name: nestjs_mongo
    profiles: ["mongo"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${DB_USERNAME:-mongo}
      MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD:-mongo}
      MONGO_INITDB_DATABASE: ${DB_NAME:-app_db}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  # ============================================================================
  # Redis Cache / Message Broker for Microservices / Queues (--profile redis)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: nestjs_redis
    profiles: ["redis", "full"]
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
  mysql_data:
  mongo_data:
  redis_data:

